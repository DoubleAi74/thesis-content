<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase Space Analysis of the Logistic Map</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #1a1a1a;
        --accent-color: #2c5282;
        --path-color: #c53030;
        --border-color: #000000;
        --font-serif: "Times New Roman", Times, serif;
        --font-sans: "Inter", -apple-system, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-serif);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        padding: 2vh 0 1vh 0;
        text-align: center;
        border-bottom: 1px solid #e2e8f0; /* Restored title line */
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
      }

      .equation {
        font-style: italic;
        font-size: 1.1rem;
        color: #444;
        margin-top: 5px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 3vw;
        padding: 0 4vw;
        min-height: 0;
      }

      .figure-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .canvas-wrapper {
        height: 60vh; /* Increased height */
        aspect-ratio: 1.3 / 1;
        border: 1px solid var(--border-color);
        background: #fff;
        display: flex;
      }

      .canvas-wrapper.square {
        aspect-ratio: 1 / 1;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .figure-label {
        margin-top: 10px;
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #666;
      }

      .controls {
        padding: 2vh 0 3vh 0; /* Moved up by reducing top padding */
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        background: #fdfdfd;
        border-top: 1px solid #eee;
        flex-shrink: 0;
        font-family: var(--font-sans);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        width: 280px;
      }

      .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.8rem;
        color: #555;
        font-weight: 600;
      }

      .value-display {
        font-family: monospace;
        color: var(--accent-color);
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        background: #ddd;
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: var(--accent-color);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Logistic Map: Bifurcation & Stability</h1>
      <div class="equation">f(z) = rz(1 &ndash; z)</div>
    </header>

    <main>
      <div class="figure-container">
        <div class="canvas-wrapper">
          <canvas id="bifurcationCanvas"></canvas>
        </div>
        <div class="figure-label">Figure 1: Bifurcation Diagram</div>
      </div>

      <div class="figure-container">
        <div class="canvas-wrapper square">
          <canvas id="cobwebCanvas"></canvas>
        </div>
        <div class="figure-label">Figure 2: Cobweb Iterations</div>
      </div>
    </main>

    <div class="controls">
      <div class="control-group">
        <div class="control-header">
          <span>Growth Rate (r)</span>
          <span class="value-display" id="rLabel">3.0000</span>
        </div>
        <input
          type="range"
          id="rSlider"
          min="0"
          max="4.0"
          step="0.0001"
          value="3.0"
        />
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Initial State (z₀)</span>
          <span class="value-display" id="zLabel">0.50</span>
        </div>
        <input
          type="range"
          id="zSlider"
          min="0"
          max="1.2"
          step="0.01"
          value="0.5"
        />
      </div>
    </div>

    <script>
      const dpr = window.devicePixelRatio || 1;
      const bifCanvas = document.getElementById("bifurcationCanvas");
      const cobCanvas = document.getElementById("cobwebCanvas");
      const rSlider = document.getElementById("rSlider");
      const zSlider = document.getElementById("zSlider");
      const rLabel = document.getElementById("rLabel");
      const zLabel = document.getElementById("zLabel");

      const bifCtx = bifCanvas.getContext("2d");
      const cobCtx = cobCanvas.getContext("2d");

      const MAX_Z = 1.2;
      const MAX_R = 4.0;
      let bifCache = null;

      function f(z, r) {
        return r * z * (1 - z);
      }

      function resize() {
        const bRect = bifCanvas.parentElement.getBoundingClientRect();
        const cRect = cobCanvas.parentElement.getBoundingClientRect();

        bifCanvas.width = bRect.width * dpr;
        bifCanvas.height = bRect.height * dpr;
        cobCanvas.width = cRect.width * dpr;
        cobCanvas.height = cRect.height * dpr;

        preRenderBifurcation();
        update();
      }

      function preRenderBifurcation() {
        const w = bifCanvas.width;
        const h = bifCanvas.height;
        bifCache = document.createElement("canvas");
        bifCache.width = w;
        bifCache.height = h;
        const ctx = bifCache.getContext("2d");

        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";

        for (let x = 0; x < w; x++) {
          let r = (x / w) * MAX_R;
          let z = 0.5;
          for (let i = 0; i < 400; i++) z = f(z, r);
          for (let i = 0; i < 200; i++) {
            z = f(z, r);
            if (z >= 0 && z <= MAX_Z) {
              ctx.fillRect(x, h - (z / MAX_Z) * h, 1, 1);
            }
          }
        }
      }

      function drawBifurcationOverlay(rVal) {
        bifCtx.clearRect(0, 0, bifCanvas.width, bifCanvas.height);
        bifCtx.drawImage(bifCache, 0, 0);

        const x = (rVal / MAX_R) * bifCanvas.width;
        bifCtx.strokeStyle = "#2c5282";
        bifCtx.lineWidth = 2 * dpr;
        bifCtx.beginPath();
        bifCtx.moveTo(x, 0);
        bifCtx.lineTo(x, bifCanvas.height);
        bifCtx.stroke();
      }

      function drawCobweb(r, z0) {
        const w = cobCanvas.width;
        const h = cobCanvas.height;
        cobCtx.clearRect(0, 0, w, h);

        // Subtle Grid
        cobCtx.strokeStyle = "#f5f5f5";
        cobCtx.lineWidth = 1 * dpr;
        for (let i = 1; i < 6; i++) {
          let p = (i / 6) * w;
          cobCtx.beginPath();
          cobCtx.moveTo(p, 0);
          cobCtx.lineTo(p, h);
          cobCtx.stroke();
          cobCtx.beginPath();
          cobCtx.moveTo(0, p);
          cobCtx.lineTo(w, p);
          cobCtx.stroke();
        }

        // Diagonal
        cobCtx.strokeStyle = "#bbb";
        cobCtx.setLineDash([5 * dpr, 5 * dpr]);
        cobCtx.beginPath();
        cobCtx.moveTo(0, h);
        cobCtx.lineTo(w / MAX_Z, 0);
        cobCtx.stroke();
        cobCtx.setLineDash([]);

        // Curve
        cobCtx.strokeStyle = "#000";
        cobCtx.lineWidth = 1.8 * dpr;
        cobCtx.beginPath();
        for (let i = 0; i <= w; i++) {
          let z = (i / w) * MAX_Z;
          let y = f(z, r);
          let cy = h - (y / MAX_Z) * h;
          if (i === 0) cobCtx.moveTo(i, cy);
          else cobCtx.lineTo(i, cy);
        }
        cobCtx.stroke();

        // Trace
        cobCtx.strokeStyle = "#c53030";
        cobCtx.lineWidth = 1.2 * dpr;
        let z = z0;
        cobCtx.beginPath();
        cobCtx.moveTo((z / MAX_Z) * w, h);
        for (let i = 0; i < 120; i++) {
          let nz = f(z, r);
          cobCtx.lineTo((z / MAX_Z) * w, h - (nz / MAX_Z) * h);
          cobCtx.lineTo((nz / MAX_Z) * w, h - (nz / MAX_Z) * h);
          z = nz;
          if (Math.abs(z) > 10) break;
        }
        cobCtx.stroke();
      }

      function update() {
        const r = parseFloat(rSlider.value);
        const z = parseFloat(zSlider.value);
        rLabel.innerText = r.toFixed(4);
        zLabel.innerText = z.toFixed(2);
        drawBifurcationOverlay(r);
        drawCobweb(r, z);
      }

      window.addEventListener("resize", resize);
      rSlider.addEventListener("input", update);
      zSlider.addEventListener("input", update);

      resize();
    </script>
  </body>
</html>
