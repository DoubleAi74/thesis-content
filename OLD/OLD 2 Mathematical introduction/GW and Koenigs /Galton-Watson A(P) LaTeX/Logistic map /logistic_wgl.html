<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase Space Analysis of the Logistic Map</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #1a1a1a;
        --accent-color: #2c5282;
        --path-color: #c53030;
        --border-color: #000000;
        --font-serif: "Times New Roman", Times, serif;
        --font-sans: "Inter", -apple-system, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-serif);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        padding: 2vh 0 1vh 0;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
      }

      .equation {
        font-style: italic;
        font-size: 1.1rem;
        color: #444;
        margin-top: 5px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 3vw;
        padding: 0 4vw;
        min-height: 0;
      }

      .figure-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .canvas-wrapper {
        height: 60vh;
        aspect-ratio: 1.3 / 1;
        border: 1px solid var(--border-color);
        background: #fff;
        display: flex;
      }

      .canvas-wrapper.square {
        aspect-ratio: 1 / 1;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .figure-label {
        margin-top: 10px;
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #666;
      }

      .controls {
        padding: 2vh 0 3vh 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        background: #fdfdfd;
        border-top: 1px solid #eee;
        flex-shrink: 0;
        font-family: var(--font-sans);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        width: 280px;
      }

      .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.8rem;
        color: #555;
        font-weight: 600;
      }

      .value-display {
        font-family: monospace;
        color: var(--accent-color);
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        background: #ddd;
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: var(--accent-color);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Logistic Map: Bifurcation & Stability</h1>
      <div class="equation">f(z) = rz(1 &ndash; z)</div>
    </header>

    <main>
      <div class="figure-container">
        <div class="canvas-wrapper">
          <canvas id="bifurcationCanvas"></canvas>
        </div>
        <div class="figure-label">Figure 1: Bifurcation Diagram</div>
      </div>

      <div class="figure-container">
        <div class="canvas-wrapper square">
          <canvas id="cobwebCanvas"></canvas>
        </div>
        <div class="figure-label">Figure 2: Cobweb Iterations</div>
      </div>
    </main>

    <div class="controls">
      <div class="control-group">
        <div class="control-header">
          <span>Growth Rate (r)</span>
          <span class="value-display" id="rLabel">3.0000</span>
        </div>
        <input
          type="range"
          id="rSlider"
          min="0"
          max="4.0"
          step="0.0001"
          value="3.0"
        />
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Initial State (z₀)</span>
          <span class="value-display" id="zLabel">0.50</span>
        </div>
        <input
          type="range"
          id="zSlider"
          min="0"
          max="1.2"
          step="0.01"
          value="0.5"
        />
      </div>
    </div>

    <script>
      // WebGL utilities
      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error("Shader compile error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function createProgram(gl, vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error("Program link error:", gl.getProgramInfoLog(program));
          gl.deleteProgram(program);
          return null;
        }
        return program;
      }

      // Bifurcation Canvas WebGL
      const bifCanvas = document.getElementById("bifurcationCanvas");
      const bifGl = bifCanvas.getContext("webgl", {
        antialias: true,
        preserveDrawingBuffer: true,
      });

      // Cobweb Canvas WebGL
      const cobCanvas = document.getElementById("cobwebCanvas");
      const cobGl = cobCanvas.getContext("webgl", { antialias: true });

      const rSlider = document.getElementById("rSlider");
      const zSlider = document.getElementById("zSlider");
      const rLabel = document.getElementById("rLabel");
      const zLabel = document.getElementById("zLabel");

      const MAX_Z = 1.2;
      const MAX_R = 4.0;

      // Vertex shader for points (bifurcation)
      const pointVertexShader = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position * 2.0 - 1.0, 0.0, 1.0);
          gl_Position.y = -gl_Position.y;
          gl_PointSize = 1.0;
        }
      `;

      // Fragment shader for points (bifurcation)
      const pointFragmentShader = `
        precision mediump float;
        void main() {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 0.25);
        }
      `;

      // Vertex shader for lines
      const lineVertexShader = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position * 2.0 - 1.0, 0.0, 1.0);
          gl_Position.y = -gl_Position.y;
        }
      `;

      // Fragment shader for lines with uniform color
      const lineFragmentShader = `
        precision mediump float;
        uniform vec4 u_color;
        void main() {
          gl_FragColor = u_color;
        }
      `;

      // Setup bifurcation WebGL
      const bifPointVS = createShader(
        bifGl,
        bifGl.VERTEX_SHADER,
        pointVertexShader,
      );
      const bifPointFS = createShader(
        bifGl,
        bifGl.FRAGMENT_SHADER,
        pointFragmentShader,
      );
      const bifPointProgram = createProgram(bifGl, bifPointVS, bifPointFS);
      const bifPointPosLoc = bifGl.getAttribLocation(
        bifPointProgram,
        "a_position",
      );

      const bifLineVS = createShader(
        bifGl,
        bifGl.VERTEX_SHADER,
        lineVertexShader,
      );
      const bifLineFS = createShader(
        bifGl,
        bifGl.FRAGMENT_SHADER,
        lineFragmentShader,
      );
      const bifLineProgram = createProgram(bifGl, bifLineVS, bifLineFS);
      const bifLinePosLoc = bifGl.getAttribLocation(
        bifLineProgram,
        "a_position",
      );
      const bifLineColorLoc = bifGl.getUniformLocation(
        bifLineProgram,
        "u_color",
      );

      const bifPointBuffer = bifGl.createBuffer();
      const bifLineBuffer = bifGl.createBuffer();

      // Setup cobweb WebGL
      const cobLineVS = createShader(
        cobGl,
        cobGl.VERTEX_SHADER,
        lineVertexShader,
      );
      const cobLineFS = createShader(
        cobGl,
        cobGl.FRAGMENT_SHADER,
        lineFragmentShader,
      );
      const cobLineProgram = createProgram(cobGl, cobLineVS, cobLineFS);
      const cobLinePosLoc = cobGl.getAttribLocation(
        cobLineProgram,
        "a_position",
      );
      const cobLineColorLoc = cobGl.getUniformLocation(
        cobLineProgram,
        "u_color",
      );

      const cobLineBuffer = cobGl.createBuffer();

      let bifurcationPoints = null;

      function f(z, r) {
        return r * z * (1 - z);
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;

        const bRect = bifCanvas.parentElement.getBoundingClientRect();
        const cRect = cobCanvas.parentElement.getBoundingClientRect();

        bifCanvas.width = bRect.width * dpr;
        bifCanvas.height = bRect.height * dpr;
        cobCanvas.width = cRect.width * dpr;
        cobCanvas.height = cRect.height * dpr;

        bifGl.viewport(0, 0, bifCanvas.width, bifCanvas.height);
        cobGl.viewport(0, 0, cobCanvas.width, cobCanvas.height);

        preRenderBifurcation();
        update();
      }

      function preRenderBifurcation() {
        const w = bifCanvas.width;
        const points = [];

        for (let x = 0; x < w; x++) {
          let r = (x / w) * MAX_R;
          let z = 0.5;
          for (let i = 0; i < 400; i++) z = f(z, r);
          for (let i = 0; i < 200; i++) {
            z = f(z, r);
            if (z >= 0 && z <= MAX_Z) {
              points.push(x / w, z / MAX_Z);
            }
          }
        }

        bifurcationPoints = new Float32Array(points);
      }

      function drawBifurcation(rVal) {
        bifGl.clearColor(1.0, 1.0, 1.0, 1.0);
        bifGl.clear(bifGl.COLOR_BUFFER_BIT);

        // Enable blending for semi-transparent points
        bifGl.enable(bifGl.BLEND);
        bifGl.blendFunc(bifGl.SRC_ALPHA, bifGl.ONE_MINUS_SRC_ALPHA);

        // Draw bifurcation points
        bifGl.useProgram(bifPointProgram);
        bifGl.bindBuffer(bifGl.ARRAY_BUFFER, bifPointBuffer);
        bifGl.bufferData(
          bifGl.ARRAY_BUFFER,
          bifurcationPoints,
          bifGl.STATIC_DRAW,
        );
        bifGl.enableVertexAttribArray(bifPointPosLoc);
        bifGl.vertexAttribPointer(bifPointPosLoc, 2, bifGl.FLOAT, false, 0, 0);
        bifGl.drawArrays(bifGl.POINTS, 0, bifurcationPoints.length / 2);

        // Draw vertical line for current r value
        const lineX = rVal / MAX_R;
        const lineVerts = new Float32Array([lineX, 0, lineX, 1]);

        bifGl.useProgram(bifLineProgram);
        bifGl.bindBuffer(bifGl.ARRAY_BUFFER, bifLineBuffer);
        bifGl.bufferData(bifGl.ARRAY_BUFFER, lineVerts, bifGl.DYNAMIC_DRAW);
        bifGl.enableVertexAttribArray(bifLinePosLoc);
        bifGl.vertexAttribPointer(bifLinePosLoc, 2, bifGl.FLOAT, false, 0, 0);
        bifGl.uniform4f(bifLineColorLoc, 0.173, 0.322, 0.51, 1.0); // #2c5282
        bifGl.lineWidth(2);
        bifGl.drawArrays(bifGl.LINES, 0, 2);
      }

      function drawCobweb(r, z0) {
        cobGl.clearColor(1.0, 1.0, 1.0, 1.0);
        cobGl.clear(cobGl.COLOR_BUFFER_BIT);

        cobGl.enable(cobGl.BLEND);
        cobGl.blendFunc(cobGl.SRC_ALPHA, cobGl.ONE_MINUS_SRC_ALPHA);

        cobGl.useProgram(cobLineProgram);
        cobGl.bindBuffer(cobGl.ARRAY_BUFFER, cobLineBuffer);
        cobGl.enableVertexAttribArray(cobLinePosLoc);
        cobGl.vertexAttribPointer(cobLinePosLoc, 2, cobGl.FLOAT, false, 0, 0);

        // Draw grid lines
        const gridLines = [];
        for (let i = 1; i < 6; i++) {
          const p = i / 6;
          // Vertical
          gridLines.push(p, 0, p, 1);
          // Horizontal
          gridLines.push(0, p, 1, p);
        }
        cobGl.bufferData(
          cobGl.ARRAY_BUFFER,
          new Float32Array(gridLines),
          cobGl.DYNAMIC_DRAW,
        );
        cobGl.uniform4f(cobLineColorLoc, 0.96, 0.96, 0.96, 1.0); // #f5f5f5
        cobGl.drawArrays(cobGl.LINES, 0, gridLines.length / 2);

        // Draw diagonal (y = x) - dashed effect via multiple segments
        const diagSegments = [];
        const dashCount = 40;
        for (let i = 0; i < dashCount; i += 2) {
          const t1 = i / dashCount;
          const t2 = (i + 1) / dashCount;
          diagSegments.push(t1 / MAX_Z, t1 / MAX_Z, t2 / MAX_Z, t2 / MAX_Z);
        }
        cobGl.bufferData(
          cobGl.ARRAY_BUFFER,
          new Float32Array(diagSegments),
          cobGl.DYNAMIC_DRAW,
        );
        cobGl.uniform4f(cobLineColorLoc, 0.733, 0.733, 0.733, 1.0); // #bbb
        cobGl.drawArrays(cobGl.LINES, 0, diagSegments.length / 2);

        // Draw parabola curve
        const curvePoints = [];
        const steps = 200;
        for (let i = 0; i <= steps; i++) {
          const z = (i / steps) * MAX_Z;
          const y = f(z, r);
          curvePoints.push(z / MAX_Z, y / MAX_Z);
        }
        cobGl.bufferData(
          cobGl.ARRAY_BUFFER,
          new Float32Array(curvePoints),
          cobGl.DYNAMIC_DRAW,
        );
        cobGl.uniform4f(cobLineColorLoc, 0.0, 0.0, 0.0, 1.0); // black
        cobGl.drawArrays(cobGl.LINE_STRIP, 0, curvePoints.length / 2);

        // Draw cobweb trace
        const tracePoints = [];
        let z = z0;
        tracePoints.push(z / MAX_Z, 0);

        for (let i = 0; i < 120; i++) {
          let nz = f(z, r);
          // Vertical to curve
          tracePoints.push(z / MAX_Z, nz / MAX_Z);
          // Horizontal to diagonal
          tracePoints.push(nz / MAX_Z, nz / MAX_Z);
          z = nz;
          if (Math.abs(z) > 10) break;
        }

        cobGl.bufferData(
          cobGl.ARRAY_BUFFER,
          new Float32Array(tracePoints),
          cobGl.DYNAMIC_DRAW,
        );
        cobGl.uniform4f(cobLineColorLoc, 0.773, 0.188, 0.188, 1.0); // #c53030
        cobGl.drawArrays(cobGl.LINE_STRIP, 0, tracePoints.length / 2);
      }

      function update() {
        const r = parseFloat(rSlider.value);
        const z = parseFloat(zSlider.value);
        rLabel.innerText = r.toFixed(4);
        zLabel.innerText = z.toFixed(2);
        drawBifurcation(r);
        drawCobweb(r, z);
      }

      window.addEventListener("resize", resize);
      rSlider.addEventListener("input", update);
      zSlider.addEventListener("input", update);

      resize();
    </script>
  </body>
</html>
