<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symbolic Regression: Evolutionary Discovery</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      :root {
        --text-color: #222;
        --border-color: #ccc;
        --accent-color: #d81b60;
        --primary-btn: #333;
        --bg-color: #fff;
        --font-serif: "Georgia", "Times New Roman", Times, serif;
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      body {
        font-family: var(--font-sans);
        background-color: #f9f9f9;
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
        min-height: 100vh;
        box-sizing: border-box;
      }

      /* Container mimicking a paper layout */
      .paper-container {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: row;
        min-height: 80vh;
      }

      /* Left Sidebar */
      .sidebar {
        width: 350px;
        padding: 30px;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      h1 {
        font-family: var(--font-serif);
        font-weight: normal;
        font-size: 1.8rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
        color: #000;
      }

      .subtitle {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 2rem;
        font-style: italic;
        font-family: var(--font-serif);
      }

      /* Controls Section */
      .control-group {
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }

      .control-group:last-of-type {
        border-bottom: none;
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 8px;
        color: #555;
      }

      /* Stats display */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        font-family: "Courier New", monospace;
        font-size: 0.9rem;
        margin-bottom: 6px;
      }

      .stat-item {
        background: #fafafa;
        padding: 12px;
        border: 1px solid #eee;
      }

      .stat-item label {
        margin-bottom: 4px;
        font-size: 0.75rem;
      }

      .stat-item .value {
        font-family: "Courier New", monospace;
        font-weight: bold;
        font-size: 1rem;
        color: #222;
      }

      /* Equation Box */
      .equation-box {
        background: #f4f4f4;
        border: 1px solid #ddd;
        padding: 15px;
        margin-top: 10px;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        word-break: break-all;
        cursor: pointer;
        position: relative;
        transition: background 0.2s;
        border-radius: 4px;
        min-height: 60px;
        line-height: 1.6;
      }
      .equation-box:hover {
        background: #eee;
        border-color: #bbb;
      }
      .equation-box::after {
        content: "Click to Copy";
        position: absolute;
        top: -10px;
        right: 10px;
        background: #333;
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        opacity: 0;
        transition: opacity 0.2s;
        font-family: var(--font-sans);
        pointer-events: none;
      }
      .equation-box:hover::after {
        opacity: 1;
      }
      .equation-box .label {
        position: absolute;
        top: -8px;
        left: 10px;
        background: #f4f4f4;
        padding: 0 6px;
        font-size: 0.7rem;
        color: #888;
        font-family: var(--font-sans);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Checkbox styling */
      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        cursor: pointer;
      }
      .checkbox-wrapper input {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--accent-color);
      }
      .checkbox-wrapper span {
        font-size: 0.9rem;
      }

      /* Slider styling */
      .slider-group {
        margin-bottom: 18px;
      }
      .slider-group label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .slider-group .slider-value {
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        color: var(--accent-color);
        font-weight: normal;
        text-transform: none;
      }
      .slider-group input[type="range"] {
        width: 100%;
        height: 4px;
        -webkit-appearance: none;
        background: #ddd;
        border-radius: 2px;
        outline: none;
      }
      .slider-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: var(--primary-btn);
        border-radius: 50%;
        cursor: pointer;
      }

      /* Buttons */
      button {
        width: 100%;
        padding: 12px;
        background: var(--primary-btn);
        color: #fff;
        border: none;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          opacity 0.2s,
          background 0.2s;
        border-radius: 2px;
        margin-top: 10px;
      }
      button:hover {
        opacity: 0.9;
      }
      button.running {
        background: var(--accent-color);
      }

      /* Visualization Area */
      .plot-container {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #fff;
        position: relative;
      }

      #plot {
        width: 100%;
        height: 100%;
        max-height: 80vh;
      }

      /* Toast Notification */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 10px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        font-size: 14px;
        opacity: 0;
        transition:
          opacity 0.3s,
          bottom 0.3s;
      }
      #toast.show {
        visibility: visible;
        opacity: 1;
        bottom: 50px;
      }

      /* Helper text */
      .helper-text {
        font-size: 0.8rem;
        color: #888;
        font-style: italic;
        margin-top: -10px;
        margin-bottom: 15px;
        font-family: var(--font-serif);
      }

      /* Mobile Responsive */
      @media (max-width: 900px) {
        body {
          padding: 0;
        }
        .paper-container {
          flex-direction: column-reverse;
          border: none;
          min-height: auto;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-top: 1px solid var(--border-color);
          box-sizing: border-box;
        }
        .plot-container {
          min-height: 400px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="paper-container">
      <!-- Controls / Info -->
      <aside class="sidebar">
        <div>
          <h1>Symbolic Regression</h1>
          <p class="subtitle">Evolutionary equation discovery</p>

          <div class="control-group">
            <label>Statistics</label>
            <div class="stats-grid">
              <div class="stat-item">
                <label>Generation</label>
                <div class="value" id="genDisplay">0</div>
              </div>
              <div class="stat-item">
                <label>Population</label>
                <div class="value">500</div>
              </div>
            </div>
            <div class="stat-row">
              <span>Best MSE:</span>
              <span id="mseDisplay" style="color: var(--accent-color)"
                >---</span
              >
            </div>
          </div>

          <div class="control-group">
            <label>Best Model Equation</label>
            <div id="eqDisplay" class="equation-box" title="Click to copy">
              <span class="label">Best Fit</span>
              <span style="color: #999; font-style: italic"
                >Run simulation...</span
              >
            </div>
          </div>

          <div class="control-group">
            <label>Settings</label>

            <div
              class="checkbox-wrapper"
              onclick="
                event.stopPropagation();
                document.getElementById('chkIntMode').click();
              "
            >
              <input
                type="checkbox"
                id="chkIntMode"
                onchange="
                  restartSimulation();
                  event.stopPropagation();
                "
              />
              <span>Integer / Rational Mode</span>
            </div>

            <div
              class="checkbox-wrapper"
              onclick="
                event.stopPropagation();
                document.getElementById('chkTrails').click();
              "
            >
              <input
                type="checkbox"
                id="chkTrails"
                onchange="
                  updateSettings();
                  event.stopPropagation();
                "
              />
              <span>Show Population Trials</span>
            </div>

            <p class="helper-text">
              Integer mode forces clean numbers; trials show the population
              cloud.
            </p>

            <div class="slider-group">
              <label>
                <span>Simplicity Pressure</span>
                <span class="slider-value" id="penaltyVal">0.0001</span>
              </label>
              <input
                type="range"
                id="penaltySlider"
                min="0"
                max="0.0001"
                step="0.000001"
                value="0.0001"
                oninput="updateSettings()"
              />
            </div>

            <div class="slider-group">
              <label>
                <span>Mutation Rate</span>
                <span class="slider-value" id="mutVal">0.25</span>
              </label>
              <input
                type="range"
                id="mutSlider"
                min="0"
                max="0.6"
                step="0.01"
                value="0.25"
                oninput="updateSettings()"
              />
            </div>

            <button id="btnStart" onclick="toggleSimulation()">
              Initialize & Evolve
            </button>
          </div>
        </div>
      </aside>

      <!-- Graph -->
      <main class="plot-container">
        <div id="plot"></div>
      </main>
    </div>

    <!-- Toast for copy action -->
    <div id="toast">Equation copied to clipboard!</div>

    <script>
      /**
       * 1. DATA PREPARATION
       */
      const rawData = `
0.00,0.5
0.01,0.49744950892200523
0.02,0.4947961454086841
0.03,0.49203568028781275
0.04,0.4891655063931692
0.05,0.4861804681386442
0.06,0.4830774611793251
0.07,0.4798516728499167
0.08,0.4764965649930478
0.09,0.4730092271000399
0.1,0.46938333702446194
0.11,0.46561045412689755
0.12,0.46168780095224604
0.13,0.45760728178648097
0.14,0.45335797129833433
0.15,0.44893751974883506
0.16,0.44433208243911365
0.17,0.43953758533578097
0.18,0.43454255921952245
0.19,0.4293311822253738
0.2,0.42390081850381817
0.21,0.4182300784035889
0.22,0.4123108180947064
0.23,0.40613172436516815
0.24,0.399669551694508
0.25,0.3929162754078347
0.26,0.38584326351619247
0.27,0.3784359299789587
0.28,0.370672189995087
0.29,0.3625279290473855
0.3,0.35397672110443756
0.31,0.3449895164077589
0.32,0.33553428875892377
0.33,0.3255756349223103
0.34,0.31506734776888573
0.35,0.3039779337611788
0.36,0.2922446697896221
0.37,0.2798182518473617
0.38,0.2666353397344354
0.39,0.252615526498267
0.4,0.23768332022995975
0.41,0.22173411227463893
0.42,0.20466312830238828
0.43,0.1863198446038385
0.44,0.16655284045247842
0.45,0.1451501913600998
0.46,0.1218716445414851
0.47,0.09638121630669728
0.48,0.06824513327478827
0.49,0.03687714681581637
0.5,0.00`;

      const X_train = [];
      const Y_train = [];
      rawData
        .trim()
        .split("\n")
        .forEach((row) => {
          const [x, y] = row.split(",").map(Number);
          X_train.push(x);
          Y_train.push(y);
        });

      /**
       * 2. CONFIGURATION
       */
      const CONFIG = {
        popSize: 500,
        maxDepth: 5,
        maxEvolveDepth: 8,
        mutationRate: 0.25,
        penaltyCoef: 0.001,
        tournamentSize: 5,
        integerMode: false,
        showTrails: false,
      };

      /**
       * 3. SYMBOLIC ENGINE
       */
      const OPS = {
        "+": (a, b) => a + b,
        "-": (a, b) => a - b,
        "*": (a, b) => a * b,
        "/": (a, b) => (Math.abs(b) < 1e-4 ? 1 : a / b),
        sin: (a) => Math.sin(a),
        cos: (a) => Math.cos(a),
        exp: (a) => Math.exp(Math.min(a, 15)),
        log: (a) => Math.log(Math.abs(a) + 1e-6),
        sqrt: (a) => Math.sqrt(Math.abs(a)),
        abs: (a) => Math.abs(a),
      };

      const ARITY = {
        "+": 2,
        "-": 2,
        "*": 2,
        "/": 2,
        sin: 1,
        cos: 1,
        exp: 1,
        log: 1,
        sqrt: 1,
        abs: 1,
      };

      const OP_KEYS = Object.keys(OPS);

      class Node {
        constructor(type, value, left = null, right = null) {
          this.type = type;
          this.value = value;
          this.left = left;
          this.right = right;
        }

        eval(x) {
          if (this.type === "const") return this.value;
          if (this.type === "special") return this.value;
          if (this.type === "var") return x;
          const v1 = this.left ? this.left.eval(x) : 0;
          const v2 = this.right ? this.right.eval(x) : 0;
          return OPS[this.value](v1, v2);
        }

        clone() {
          return new Node(
            this.type,
            this.value,
            this.left?.clone(),
            this.right?.clone(),
          );
        }

        size() {
          return 1 + (this.left?.size() || 0) + (this.right?.size() || 0);
        }

        depth() {
          return (
            1 + Math.max(this.left?.depth() || 0, this.right?.depth() || 0)
          );
        }

        toString() {
          if (this.type === "special") {
            if (Math.abs(this.value - Math.PI) < 1e-5) return "π";
            if (Math.abs(this.value - Math.E) < 1e-5) return "e";
          }
          if (this.type === "const") {
            return CONFIG.integerMode
              ? Math.round(this.value)
              : parseFloat(this.value.toFixed(3));
          }
          if (this.type === "var") return "P";
          if (ARITY[this.value] === 1)
            return `${this.value}(${this.left.toString()})`;
          return `(${this.left.toString()} ${this.value} ${this.right.toString()})`;
        }
      }

      function generateConst() {
        if (CONFIG.integerMode) {
          const r = Math.random();
          if (r < 0.05) return new Node("special", Math.PI);
          if (r < 0.1) return new Node("special", Math.E);
          const val = Math.floor(Math.random() * 21) - 10;
          return new Node("const", val);
        } else {
          return new Node("const", Math.random() * 6 - 3);
        }
      }

      function generateTree(depth, maxDepth) {
        if (depth >= maxDepth || (depth > 1 && Math.random() < 0.4)) {
          return Math.random() < 0.6 ? new Node("var", "P") : generateConst();
        }
        const op = OP_KEYS[Math.floor(Math.random() * OP_KEYS.length)];
        const node = new Node("op", op);
        node.left = generateTree(depth + 1, maxDepth);
        if (ARITY[op] === 2) node.right = generateTree(depth + 1, maxDepth);
        return node;
      }

      function getSubtrees(node, list = []) {
        list.push(node);
        if (node.left) getSubtrees(node.left, list);
        if (node.right) getSubtrees(node.right, list);
        return list;
      }

      function mutate(tree) {
        const t = tree.clone();
        const rand = Math.random();

        if (rand < 0.15) {
          replaceRandomNode(t, generateTree(0, 3));
        } else if (rand < 0.6) {
          jitterConstants(t);
        } else {
          swapOp(t);
        }
        return t;
      }

      function jitterConstants(node) {
        if (node.type === "const") {
          if (CONFIG.integerMode) {
            node.value += Math.random() < 0.5 ? 1 : -1;
          } else {
            node.value += (Math.random() - 0.5) * 0.5;
          }
        }
        if (node.left) jitterConstants(node.left);
        if (node.right) jitterConstants(node.right);
      }

      function swapOp(node) {
        const list = getSubtrees(node).filter((n) => n.type === "op");
        if (list.length === 0) return;
        const target = list[Math.floor(Math.random() * list.length)];
        const compatible = OP_KEYS.filter(
          (k) => ARITY[k] === ARITY[target.value],
        );
        target.value =
          compatible[Math.floor(Math.random() * compatible.length)];
      }

      function replaceRandomNode(root, newPart) {
        if (!root.left && !root.right) return newPart;

        let curr = root;
        let parent = null;
        let isLeft = false;

        while (curr.left || curr.right) {
          parent = curr;
          if (curr.right && Math.random() < 0.5) {
            curr = curr.right;
            isLeft = false;
          } else if (curr.left) {
            curr = curr.left;
            isLeft = true;
          } else {
            break;
          }
          if (Math.random() < 0.3) break;
        }

        if (parent) {
          if (isLeft) parent.left = newPart;
          else parent.right = newPart;
        }
      }

      function crossover(p1, p2) {
        const c1 = p1.clone();
        const list2 = getSubtrees(p2);
        const sub2 = list2[Math.floor(Math.random() * list2.length)].clone();
        replaceRandomNode(c1, sub2);
        return c1.depth() > CONFIG.maxEvolveDepth ? p1 : c1;
      }

      /**
       * 4. EVALUATION
       */
      function evaluate(tree) {
        const preds = X_train.map((x) => tree.eval(x));

        if (preds.some((v) => !isFinite(v)))
          return { score: Infinity, mse: Infinity };

        let slope = 1;
        let intercept = 0;

        if (!CONFIG.integerMode) {
          let sumX = 0,
            sumY = 0,
            sumXY = 0,
            sumXX = 0;
          const n = preds.length;
          for (let i = 0; i < n; i++) {
            sumX += preds[i];
            sumY += Y_train[i];
            sumXY += preds[i] * Y_train[i];
            sumXX += preds[i] * preds[i];
          }
          const denominator = n * sumXX - sumX * sumX;
          if (Math.abs(denominator) > 1e-9) {
            slope = (n * sumXY - sumX * sumY) / denominator;
            intercept = (sumY - slope * sumX) / n;
          }
        }

        let mse = 0;
        for (let i = 0; i < preds.length; i++) {
          const finalPred = slope * preds[i] + intercept;
          const diff = Y_train[i] - finalPred;
          mse += diff * diff;
        }
        mse /= preds.length;

        const score = mse + tree.size() * CONFIG.penaltyCoef;

        return { score, mse, slope, intercept, tree };
      }

      // --- MAIN LOOP ---

      let population = [];
      let generation = 0;
      let isRunning = false;
      let animationId;
      let bestSolution = null;

      function updateSettings() {
        CONFIG.penaltyCoef = parseFloat(
          document.getElementById("penaltySlider").value,
        );
        CONFIG.mutationRate = parseFloat(
          document.getElementById("mutSlider").value,
        );
        CONFIG.integerMode = document.getElementById("chkIntMode").checked;
        CONFIG.showTrails = document.getElementById("chkTrails").checked;

        document.getElementById("penaltyVal").textContent =
          CONFIG.penaltyCoef.toFixed(6);
        document.getElementById("mutVal").textContent =
          CONFIG.mutationRate.toFixed(2);
      }

      function initPopulation() {
        population = [];
        for (let i = 0; i < CONFIG.popSize; i++)
          population.push(generateTree(0, CONFIG.maxDepth));
        generation = 0;
      }

      function runGeneration() {
        if (!isRunning) return;

        const results = population.map(evaluate);
        results.sort((a, b) => a.score - b.score);
        bestSolution = results[0];

        document.getElementById("genDisplay").innerText = generation;
        document.getElementById("mseDisplay").innerText =
          bestSolution.mse.toFixed(8);

        let eqString = bestSolution.tree.toString();

        if (!CONFIG.integerMode) {
          eqString = `${bestSolution.slope.toFixed(4)} × [ ${eqString} ] + ${bestSolution.intercept.toFixed(4)}`;
        }

        document.getElementById("eqDisplay").innerHTML =
          `<span class="label">Best Fit</span>` + eqString;

        updatePlot(results);

        const newPop = [];
        for (let i = 0; i < 5; i++) newPop.push(results[i].tree.clone());

        while (newPop.length < CONFIG.popSize) {
          const tournament = () => {
            let best = results[Math.floor(Math.random() * results.length)];
            for (let k = 0; k < 4; k++) {
              let cand = results[Math.floor(Math.random() * results.length)];
              if (cand.score < best.score) best = cand;
            }
            return best.tree;
          };

          if (Math.random() < CONFIG.mutationRate) {
            newPop.push(mutate(tournament()));
          } else {
            newPop.push(crossover(tournament(), tournament()));
          }
        }

        population = newPop;
        generation++;
        animationId = requestAnimationFrame(runGeneration);
      }

      function toggleSimulation() {
        const btn = document.getElementById("btnStart");
        if (isRunning) {
          isRunning = false;
          cancelAnimationFrame(animationId);
          btn.innerText = "Resume Simulation";
          btn.classList.remove("running");
        } else {
          if (population.length === 0) initPopulation();
          isRunning = true;
          btn.innerText = "Pause Simulation";
          btn.classList.add("running");
          runGeneration();
        }
      }

      function restartSimulation() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        updateSettings();
        initPopulation();
        toggleSimulation();
      }

      // --- PLOTTING ---

      const layout = {
        font: { family: "Inter, sans-serif" },
        autosize: true,
        margin: { l: 50, r: 20, t: 30, b: 40 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        showlegend: false,
        xaxis: {
          title: "P (Input)",
          zeroline: false,
          showgrid: true,
          gridcolor: "#eee",
          linecolor: "#333",
        },
        yaxis: {
          title: "A (Observed)",
          zeroline: false,
          showgrid: true,
          gridcolor: "#eee",
          linecolor: "#333",
          range: [-0.1, 0.6],
          scaleanchor: "x",
          scaleratio: 1,
        },
      };

      function initPlot() {
        const trace = {
          x: X_train,
          y: Y_train,
          mode: "markers",
          name: "Observed",
          marker: { color: "#000", size: 5 },
        };

        Plotly.newPlot("plot", [trace], layout, {
          responsive: true,
          displayModeBar: false,
        });
      }

      function updatePlot(results) {
        const traceData = {
          x: X_train,
          y: Y_train,
          mode: "markers",
          name: "Observed",
          marker: { color: "#000", size: 6, opacity: 0.7 },
        };

        const traces = [traceData];

        const xLine = [];
        for (let x = 0; x <= 0.55; x += 0.005) {
          xLine.push(x);
        }

        if (CONFIG.showTrails) {
          const allX = [];
          const allY = [];
          const step = 5;

          for (let i = 1; i < results.length; i += step) {
            const sol = results[i];

            for (let k = 0; k < xLine.length; k++) {
              const val = sol.tree.eval(xLine[k]);
              const yVal = sol.slope * val + sol.intercept;

              if (isFinite(yVal) && Math.abs(yVal) < 1000) {
                allX.push(xLine[k]);
                allY.push(yVal);
              } else {
                allX.push(xLine[k]);
                allY.push(null);
              }
            }
            allX.push(null);
            allY.push(null);
          }

          traces.push({
            x: allX,
            y: allY,
            mode: "lines",
            line: { color: "#999", width: 1 },
            opacity: 0.3,
            hoverinfo: "skip",
            type: "scatter",
          });
        }

        const best = results[0];
        const yBest = xLine.map((x) => {
          const raw = best.tree.eval(x);
          return best.slope * raw + best.intercept;
        });

        traces.push({
          x: xLine,
          y: yBest,
          mode: "lines",
          name: "Best Fit",
          line: {
            color: "#d81b60",
            width: 3,
          },
        });

        Plotly.react("plot", traces, layout);
      }

      // Copy to clipboard
      document
        .getElementById("eqDisplay")
        .addEventListener("click", function () {
          const text = this.innerText.replace("Best Fit", "").trim();
          navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => {
              toast.className = toast.className.replace("show", "");
            }, 3000);
          });
        });

      updateSettings();
      initPlot();

      window.addEventListener("resize", () => {
        Plotly.Plots.resize("plot");
      });
    </script>
  </body>
</html>
