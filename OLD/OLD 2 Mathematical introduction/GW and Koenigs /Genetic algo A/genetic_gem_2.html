<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genetic Algorithm Polynomial Fit</title>
    <!-- Load Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      :root {
        --primary-color: #2c3e50;
        --accent-color: #3498db;
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: var(--bg-color);
        color: #333;
        height: 100vh;
        display: flex;
        align-items: center;
        justify_content: center;
      }

      /* Main Dashboard Layout */
      .dashboard {
        display: flex;
        flex-direction: row; /* Side by side on desktop */
        width: 95%;
        max-width: 1400px;
        height: 90vh; /* Occupy most of the screen height */
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        margin-left: 20px;
      }

      /* Sidebar (Controls & Info) */
      .sidebar {
        flex: 1;
        min-width: 300px;
        padding: 40px;
        background: #fafafa;
        border-right: 1px solid #eee;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .sidebar h1 {
        font-size: 24px;
        color: var(--primary-color);
        margin-bottom: 10px;
        line-height: 1.2;
      }

      .sidebar p {
        color: #666;
        line-height: 1.6;
        margin-bottom: 30px;
        font-size: 14px;
      }

      /* Stats Card */
      .stats-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .stat-row:last-child {
        margin-bottom: 0;
      }
      .stat-label {
        color: #888;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .stat-value {
        font-family: "Courier New", monospace;
        font-weight: bold;
        color: var(--primary-color);
      }

      /* Button */
      button {
        padding: 15px 30px;
        cursor: pointer;
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        transition:
          background 0.2s,
          transform 0.1s;
        width: 100%;
      }
      button:hover {
        background: #2980b9;
      }
      button:active {
        transform: scale(0.98);
      }

      /* Plot Area */
      .plot-wrapper {
        flex: 2; /* Takes up 2/3rds of space */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #fff;
      }

      /* The container for the plot to force square aspect ratio */
      #plot {
        width: 100%;
        max-width: 85vh; /* Limit width based on height to prevent scrolling */
        aspect-ratio: 1 / 1; /* Modern CSS to force square box */
      }

      /* Responsive adjustments for mobile/tablet */
      @media (max-width: 900px) {
        body {
          height: auto;
          display: block;
          padding: 20px;
        }
        .dashboard {
          flex-direction: column-reverse; /* Plot on top, controls below */
          height: auto;
          width: 100%;
          max-width: 600px;
          margin: 0 auto;
        }
        .sidebar {
          border-right: none;
          border-top: 1px solid #eee;
          padding: 20px;
        }
        .plot-wrapper {
          padding: 10px;
        }
        #plot {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <!-- Left Panel: Controls -->
      <div class="sidebar">
        <div>
          <h1>Genetic Algorithm:<br />Polynomial Fit</h1>
          <p>
            An evolutionary approach to regression. The algorithm evolves a
            population of rational polynomials to minimize the Mean Squared
            Error (MSE) against the observed dataset.
          </p>

          <div class="stats-card">
            <div class="stat-row">
              <span class="stat-label">Generation</span>
              <span class="stat-value" id="genCount">0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Best MSE (Fitness)</span>
              <span class="stat-value" id="bestScore">---</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Population Size</span>
              <span class="stat-value">50</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Mutation Rate</span>
              <span class="stat-value">30%</span>
            </div>
          </div>

          <button id="btnStart" onclick="startSimulation()">
            Start Simulation
          </button>
        </div>
      </div>

      <!-- Right Panel: Visualization -->
      <div class="plot-wrapper">
        <div id="plot"></div>
      </div>
    </div>

    <script>
      /**
       * DATA PREPARATION
       */
      const rawData = `0.01,0.49744950892200523
0.02,0.4947961454086841
0.03,0.49203568028781275
0.04,0.4891655063931692
0.05,0.4861804681386442
0.06,0.4830774611793251
0.07,0.4798516728499167
0.08,0.4764965649930478
0.09,0.4730092271000399
0.1,0.46938333702446194
0.11,0.46561045412689755
0.12,0.46168780095224604
0.13,0.45760728178648097
0.14,0.45335797129833433
0.15,0.44893751974883506
0.16,0.44433208243911365
0.17,0.43953758533578097
0.18,0.43454255921952245
0.19,0.4293311822253738
0.2,0.42390081850381817
0.21,0.4182300784035889
0.22,0.4123108180947064
0.23,0.40613172436516815
0.24,0.399669551694508
0.25,0.3929162754078347
0.26,0.38584326351619247
0.27,0.3784359299789587
0.28,0.370672189995087
0.29,0.3625279290473855
0.3,0.35397672110443756
0.31,0.3449895164077589
0.32,0.33553428875892377
0.33,0.3255756349223103
0.34,0.31506734776888573
0.35,0.3039779337611788
0.36,0.2922446697896221
0.37,0.2798182518473617
0.38,0.2666353397344354
0.39,0.252615526498267
0.4,0.23768332022995975
0.41,0.22173411227463893
0.42,0.20466312830238828
0.43,0.1863198446038385
0.44,0.16655284045247842
0.45,0.1451501913600998
0.46,0.1218716445414851
0.47,0.09638121630669728
0.48,0.06824513327478827
0.49,0.03687714681581637
0.5,0.0044555971049409825`;

      const Pvals = [];
      const Avals = [];

      // Parse Data
      const rows = rawData.trim().split("\n");
      rows.forEach((row) => {
        const parts = row.split(",");
        Pvals.push(parseFloat(parts[0]));
        Avals.push(parseFloat(parts[1]));
      });

      /**
       * GENETIC ALGORITHM CONFIGURATION
       */
      const NumBases = 100;
      const N = 50; // Population size
      const mutRate = 0.3;
      const numGenerations = 1000;
      let population = [];
      let generationCount = 0;
      let animationId = null;

      // Helper: Gaussian Random (Box-Muller transform)
      function randomNormal(mean, std) {
        let u = 0,
          v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        const num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        return num * std + mean;
      }

      function generateRandomSolution() {
        let chrom1 = new Array(NumBases)
          .fill(0)
          .map(() => Math.floor(randomNormal(0, 5)));
        let chrom2 = new Array(NumBases)
          .fill(0)
          .map(() => Math.floor(randomNormal(0, 5)));
        chrom2 = chrom2.map((val) => (val === 0 ? 1 : val));

        // Initial Conditions
        chrom1[0] = 1;
        chrom2[0] = 2;

        return [chrom1, chrom2];
      }

      function evaluatePolynomial(P, solution) {
        let polyOut = 0;
        const chrom1 = solution[0];
        const chrom2 = solution[1];

        for (let i = 0; i < NumBases; i++) {
          let n1 = chrom1[i];
          let n2 = chrom2[i];
          if (n2 !== 0) {
            polyOut += (n1 / n2) * Math.pow(P, i);
          }
        }
        return polyOut;
      }

      function scoreSolution(solution) {
        let sumSqDiff = 0;
        for (let i = 0; i < Pvals.length; i++) {
          const P = Pvals[i];
          const A = Avals[i];
          const polyVal = evaluatePolynomial(P, solution);
          sumSqDiff += Math.pow(A - polyVal, 2);
        }

        const mse = sumSqDiff / Pvals.length;
        const fromZeroSq = Math.pow(evaluatePolynomial(0.5, solution), 2);

        return mse + fromZeroSq * 100;
      }

      function chooseRandFromOrder(size) {
        let probs = [];
        let prSum = 0;
        for (let i = 1; i <= size; i++) {
          let val = 1 / i;
          probs.push(val);
          prSum += val;
        }

        const rand = Math.random() * prSum;
        let sum = 0;
        for (let i = 0; i < size; i++) {
          sum += probs[i];
          if (rand < sum) return i;
        }
        return size - 1;
      }

      function mutate(child) {
        for (let chromIndx = 0; chromIndx < 2; chromIndx++) {
          for (let baseIndx = 1; baseIndx < NumBases; baseIndx++) {
            if (Math.random() < mutRate) {
              const mutation = Math.floor(randomNormal(0, 5));
              child[chromIndx][baseIndx] += mutation;
              if (chromIndx === 1 && child[chromIndx][baseIndx] === 0) {
                child[chromIndx][baseIndx] += mutation;
                if (child[chromIndx][baseIndx] === 0)
                  child[chromIndx][baseIndx] = 1;
              }
            }
          }
        }
        return child;
      }

      function crossover(parent1, parent2) {
        let child = [new Array(NumBases).fill(0), new Array(NumBases).fill(0)];
        for (let chromIndx = 0; chromIndx < 2; chromIndx++) {
          for (let baseIndx = 0; baseIndx < NumBases; baseIndx++) {
            child[chromIndx][baseIndx] =
              Math.random() < 0.5
                ? parent1[chromIndx][baseIndx]
                : parent2[chromIndx][baseIndx];
          }
        }
        return child;
      }

      function makeNewGeneration(populationSorted) {
        let newPop = [];
        newPop.push(JSON.parse(JSON.stringify(populationSorted[0]))); // Keep best

        for (let i = 0; i < N - 1; i++) {
          const parent1 = populationSorted[chooseRandFromOrder(N)];
          const parent2 = populationSorted[chooseRandFromOrder(N)];
          let child = crossover(parent1, parent2);
          child = mutate(child);
          newPop.push(child);
        }
        return newPop;
      }

      /**
       * VISUALIZATION & LOOP
       */

      function getLayout() {
        return {
          autosize: true, // Let Plotly adapt to the container size
          margin: { l: 60, r: 20, t: 40, b: 60 }, // Cleaner margins
          title: {
            text: "Evolution of Fit",
            font: { size: 18, color: "#444" },
          },
          xaxis: {
            title: "P",
            range: [0, 0.6],
            constrain: "domain",
          },
          yaxis: {
            title: "A(P)",
            range: [0, 0.6],
            scaleanchor: "x", // Forces 1 unit Y = 1 unit X
            scaleratio: 1,
          },
          showlegend: false,
        };
      }

      function initPlot() {
        const traceData = {
          x: Pvals,
          y: Avals,
          mode: "markers",
          type: "scatter",
          name: "Data",
          marker: { color: "#3498db", size: 6 },
        };

        // Pass {responsive: true} to enable automatic resizing
        Plotly.newPlot("plot", [traceData], getLayout(), {
          responsive: true,
          displayModeBar: false,
        });
      }

      function updatePlot(sortedPop) {
        const X = [];
        for (let p = 0; p <= 0.6; p += 0.01) X.push(p);

        const traces = [];

        // Data Points
        traces.push({
          x: Pvals,
          y: Avals,
          mode: "markers",
          type: "scatter",
          marker: { color: "#3498db", size: 6, opacity: 0.8 },
        });

        // Top solutions (limit to 20 for performance)
        const numToShow = Math.min(sortedPop.length, 20);

        for (let i = numToShow - 1; i >= 0; i--) {
          const sol = sortedPop[i];
          const Y = X.map((x) => evaluatePolynomial(x, sol));
          const isBest = i === 0;

          traces.push({
            x: X,
            y: Y,
            mode: "lines",
            type: "scatter",
            line: {
              color: isBest ? "#e74c3c" : "#333",
              width: isBest ? 3 : 1,
            },
            opacity: isBest ? 1 : 0.1,
          });
        }

        Plotly.react("plot", traces, getLayout(), {
          responsive: true,
          displayModeBar: false,
        });
      }

      function runGeneration() {
        const scores = population.map((sol, index) => ({
          index: index,
          score: scoreSolution(sol),
        }));

        scores.sort((a, b) => a.score - b.score);
        const sortedPop = scores.map((s) => population[s.index]);
        const bestMSE = scores[0].score;

        document.getElementById("genCount").innerText = generationCount;
        document.getElementById("bestScore").innerText = bestMSE.toFixed(6);

        updatePlot(sortedPop);

        population = makeNewGeneration(sortedPop);
        generationCount++;

        if (generationCount < numGenerations) {
          animationId = requestAnimationFrame(runGeneration);
        } else {
          document.getElementById("btnStart").innerText = "Restart Simulation";
          document.getElementById("btnStart").disabled = false;
          document.getElementById("btnStart").style.background = "#2c3e50";
        }
      }

      function startSimulation() {
        if (animationId) cancelAnimationFrame(animationId);

        const btn = document.getElementById("btnStart");
        btn.innerText = "Running...";
        btn.disabled = true;
        btn.style.background = "#95a5a6";

        population = [];
        for (let i = 0; i < N; i++) {
          population.push(generateRandomSolution());
        }
        generationCount = 0;

        initPlot();
        runGeneration();
      }

      initPlot();

      // Handle window resize explicitly to keep plot sharp
      window.onresize = function () {
        Plotly.Plots.resize("plot");
      };
    </script>
  </body>
</html>
